name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite (pytest)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/ -q
      - name: Run test suite (stdlib unittest, no deps)
        run: python -m unittest discover -s tests
      - name: Validate server.json manifest
        run: python -c "import json;json.load(open('server.json'))"